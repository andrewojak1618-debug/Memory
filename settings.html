<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A two-player memory game." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Settings | Memory</title>
  </head>
  <body>
    <main class="app">
      <section class="settings" id="settings_view" aria-labelledby="settings_title">
        <h1 class="settings__header" id="settings_title" tabindex="-1">
          <span class="settings__marker" aria-hidden="true"></span>
          <span class="settings__title">Settings</span>
        </h1>

        <div class="settings__context">
          <div class="settings__layout">
            <form class="settings__form" id="settings_form">
              <fieldset class="setting_group setting_group_theme">
                <legend class="setting_group__title">
                  <img class="setting_group__icon" src="/assets/icons/game_theme_icon.svg" alt="" aria-hidden="true" loading="lazy" decoding="async" />
                  <span>Game theme</span>
                </legend>
                <div class="setting_options">
                  <label class="setting_option">
                    <input type="radio" name="theme" value="code_vibes" />
                    <span>Code Vibes theme</span>
                  </label>
                  <label class="setting_option">
                    <input type="radio" name="theme" value="da_projects" />
                    <span>DA Projects theme</span>
                  </label>
                </div>
              </fieldset>

              <div class="player_board_container">
                <fieldset class="setting_group setting_group_player" disabled>
                  <legend class="setting_group__title">
                    <img class="setting_group__icon" src="/assets/icons/chess_pawn_blue.svg" alt="" aria-hidden="true" loading="lazy" decoding="async" />
                    <span>Choose player</span>
                  </legend>
                  <div class="setting_options">
                    <label class="setting_option">
                      <input id="player_blue" type="radio" name="player" value="blue" aria-describedby="player_assignment" />
                      <span>Blue</span>
                    </label>
                    <label class="setting_option">
                      <input id="player_orange" type="radio" name="player" value="orange" aria-describedby="player_assignment" />
                      <span>Orange</span>
                    </label>
                  </div>
                  <p class="player_assignment_status visually_hidden" id="player_assignment" aria-live="polite" aria-atomic="true">
                    Choose a color for Player 1. Player 2 receives the other
                    color automatically.
                  </p>
                </fieldset>

                <fieldset class="setting_group setting_group_board" disabled>
                  <legend class="setting_group__title">
                    <img class="setting_group__icon" src="/assets/icons/board_size_icon.svg" alt="" aria-hidden="true" loading="lazy" decoding="async" />
                    <span>Board size</span>
                  </legend>
                  <div class="setting_options">
                    <label class="setting_option">
                      <input type="radio" name="board_size" value="4x4" />
                      <span>16 cards</span>
                    </label>
                    <label class="setting_option">
                      <input type="radio" name="board_size" value="4x6" />
                      <span>24 cards</span>
                    </label>
                    <label class="setting_option">
                      <input type="radio" name="board_size" value="6x6" />
                      <span>36 cards</span>
                    </label>
                  </div>
                </fieldset>
              </div>
            </form>

            <aside class="settings__preview" id="code_vibes_preview" aria-label="Code Vibes preview">
              <div class="theme_preview_container">
                <div class="theme_preview_header" aria-hidden="true">
                  <div class="theme_preview_header__left">
                    <div class="theme_preview_header__left_first">
                      <div class="theme_preview_header__blue_content">
                        <img class="theme_preview_header__arrow" src="/assets/icons/blue_player_arrow.svg" alt="" loading="lazy" decoding="async" />
                        <p class="theme_preview_header__blue_label">Blue</p>
                      </div>
                      <span class="theme_preview_header__blue_score">0</span>
                    </div>
                    <div class="theme_preview_header__left_second">
                      <div class="theme_preview_header__orange_content">
                        <img class="theme_preview_header__orange_arrow" src="/assets/icons/orange_player_arrow.svg" alt="" loading="lazy" decoding="async" />
                        <p class="theme_preview_header__orange_label">Orange</p>
                      </div>
                      <span class="theme_preview_header__orange_score">6</span>
                    </div>
                  </div>
                  <div class="theme_preview_header__center">
                    <div class="theme_preview_header__center_content">
                      <p class="theme_preview_header__current_player">
                        Current player:
                      </p>
                      <img class="theme_preview_header__current_player_arrow" src="/assets/icons/blue_player_arrow.svg" alt="" loading="lazy" decoding="async" />
                    </div>
                  </div>
                  <div class="theme_preview_header__right">
                    <img class="theme_preview_header__exit_icon" src="/assets/icons/exit_game_white_icon.svg" alt="" loading="lazy" decoding="async" />
                    <p class="theme_preview_header__exit_text">Exit game</p>
                  </div>
                </div>
                <figure class="theme_preview">
                  <img
                    class="theme_preview__card theme_preview__card_back"
                    src="/assets/images/code_vibes_preview_card_back.png"
                    alt="Back of a Code Vibes memory card"
                    loading="lazy"
                    decoding="async"
                  />
                  <img
                    class="theme_preview__card theme_preview__card_front"
                    src="/assets/images/code_vibes_preview_card_front.png"
                    alt="Code Vibes memory card with a Git symbol"
                    loading="lazy"
                    decoding="async"
                  />
                </figure>
              </div>
            </aside>
            <div class="settings__preview settings__preview_da_projects" id="da_projects_preview" aria-hidden="true" hidden>
              <div class="settings__preview_da_projects_content">
                <div class="settings__preview_da_projects_header">
                  <div class="settings__preview_da_projects_header_left">
                    <div class="settings__preview_da_projects_header_left_first">
                      <img class="settings__preview_da_projects_pawn" src="/assets/icons/chess_pawn_orange.svg" alt="" loading="lazy" decoding="async" />
                      <span class="settings__preview_da_projects_score">6</span>
                    </div>
                    <div class="settings__preview_da_projects_header_left_second">
                      <img class="settings__preview_da_projects_pawn" src="/assets/icons/chess_pawn_blue.svg" alt="" loading="lazy" decoding="async" />
                      <span class="settings__preview_da_projects_score_blue">2</span>
                    </div>
                  </div>
                  <div class="settings__preview_da_projects_header_center">
                    <div class="settings__preview_da_projects_current_player">
                      <p>Current player:</p>
                    </div>
                    <img class="settings__preview_da_projects_current_player_icon" src="/assets/icons/current_player_blue_icon.svg" alt="" loading="lazy" decoding="async" />
                  </div>
                  <div class="settings__preview_da_projects_header_right">
                    <div class="settings__preview_da_projects_exit_icon_container">
                      <img class="settings__preview_da_projects_exit_icon" src="/assets/icons/exit_game_blue_icon.svg" alt="" loading="lazy" decoding="async" />
                    </div>
                    <div class="settings__preview_da_projects_exit_text">
                      <p>Exit game</p>
                    </div>
                  </div>
                </div>
                <div class="settings__preview_da_projects_board">
                  <div class="settings__preview_da_projects_board_card">
                    <img class="settings__preview_da_projects_poll_back" src="/assets/images/da_projects_card_motif.svg" alt="" loading="lazy" decoding="async" />
                  </div>
                  <div class="settings__preview_da_projects_board_card_left">
                    <div class="settings__preview_da_projects_pc_container">
                      <img class="settings__preview_da_projects_pc" src="/assets/images/da_projects_card_back_logo.svg" alt="" loading="lazy" decoding="async" />
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <footer class="settings__footer">
            <div class="settings__steps">
              <ol class="settings__step_list" aria-label="Game setup steps">
                <li id="theme_step">Theme</li>
                <li id="player_step">Player</li>
                <li id="board_step">Board size</li>
              </ol>
              <p
                class="settings__validation_message"
                id="settings_validation_message"
                role="status"
                aria-live="polite"
                hidden
              ></p>
              <button
                class="start_button"
                id="start_button"
                type="button"
                aria-describedby="settings_validation_message"
              >
                <span class="start_button__icon_container" aria-hidden="true">
                  <img
                    class="start_button__icon"
                    src="/assets/icons/start_game_icon.svg"
                    alt=""
                    loading="lazy"
                    decoding="async"
                  />
                </span>
                <span class="start_button__label">Start</span>
              </button>
            </div>
          </footer>
        </div>
      </section>
    </main>

    <script type="module" src="/src/settings-page.ts"></script>
  </body>
</html>
