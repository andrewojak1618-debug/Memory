<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A two-player memory game." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Memory</title>
  </head>
  <body>
    <main class="app">
      <section class="home" id="home_view" aria-labelledby="home_title">
        <div class="home__content">
          <header class="home__headline">
            <p class="home__eyebrow">It’s play time.</p>
            <h1 class="home__title" id="home_title">Ready to play?</h1>
          </header>
        </div>

        <button class="play_button" id="play_button" type="button">
          <img
            class="play_button__icon"
            src="/assets/icons/controller.svg"
            alt=""
            aria-hidden="true"
          />
          <span class="play_button__label">Play</span>
          <span class="play_button__arrow" aria-hidden="true">→</span>
        </button>

        <img
          class="home__controller"
          src="/assets/icons/controller.svg"
          alt=""
          aria-hidden="true"
        />
      </section>

      <section
        class="settings"
        id="settings_view"
        aria-labelledby="settings_title"
        hidden
      >
        <div>
          <h1
            class="settings__header"
            id="settings_title"
            tabindex="-1"
          >
            <span class="settings__marker" aria-hidden="true"></span>
            <span class="settings__title">Settings</span>
          </h1>

          <div class="settings__context">
            <div class="settings__layout">
              <form class="settings__form" id="settings_form">
              <fieldset class="setting_group setting_group_theme">
                <legend class="setting_group__title">
                  <img
                    class="setting_group__icon"
                    src="/assets/icons/palette-game-themes.svg"
                    alt=""
                    aria-hidden="true"
                  />
                  <span>Game theme</span>
                </legend>
                <div class="setting_options">
                  <label class="setting_option">
                    <input type="radio" name="theme" value="code_vibes" />
                    <span>Code Vibes</span>
                  </label>
                </div>
              </fieldset>

              <div class="player_board_container">
                <fieldset class="setting_group setting_group_player">
                <legend class="setting_group__title">
                  <img
                    class="setting_group__icon"
                    src="/assets/icons/chess-pawn-blue.svg"
                    alt=""
                    aria-hidden="true"
                  />
                  <span>Choose player</span>
                </legend>
                <div class="setting_options">
                  <label class="setting_option">
                    <input type="radio" name="player" value="blue" />
                    <span>Blue</span>
                  </label>
                  <label class="setting_option">
                    <input type="radio" name="player" value="orange" />
                    <span>Orange</span>
                  </label>
                </div>
                </fieldset>

                <fieldset class="setting_group setting_group_board">
                <legend class="setting_group__title">
                  <img
                    class="setting_group__icon"
                    src="/assets/icons/style-board-size.svg"
                    alt=""
                    aria-hidden="true"
                  />
                  <span>Board size</span>
                </legend>
                <div class="setting_options">
                  <label class="setting_option">
                    <input type="radio" name="board_size" value="4x4" />
                    <span>16 cards</span>
                  </label>
                  <label class="setting_option">
                    <input type="radio" name="board_size" value="4x6" />
                    <span>24 cards</span>
                  </label>
                  <label class="setting_option">
                    <input type="radio" name="board_size" value="6x6" />
                    <span>36 cards</span>
                  </label>
                </div>
                </fieldset>
              </div>
              </form>

              <aside class="settings__preview" aria-label="Code Vibes preview">
              <div class="theme_preview_container">
                <figure class="theme_preview">
                  <img
                    class="theme_preview__card theme_preview__card_back"
                    src="/assets/images/code-vibes-card-back.png"
                    alt="Back of a Code Vibes memory card"
                  />
                  <img
                    class="theme_preview__card theme_preview__card_front"
                    src="/assets/images/code-vibes-card-front.png"
                    alt="Code Vibes memory card with a Git symbol"
                  />
                </figure>
              </div>
              </aside>
            </div>

            <footer class="settings__footer">
              <div class="settings__steps">
                <ol class="settings__step_list" aria-label="Game setup steps">
                  <li id="theme_step">Game theme</li>
                  <li id="player_step">Player</li>
                  <li id="board_step">Board size</li>
                  <li class="settings__start_item">
                    <button
                      class="start_button"
                      id="start_button"
                      type="button"
                      disabled
                    >
                      <span class="start_button__icon_container" aria-hidden="true">
                        <img
                          class="start_button__icon"
                          src="/assets/icons/smart-display.svg"
                          alt=""
                        />
                      </span>
                      <span class="start_button__label">Start</span>
                    </button>
                  </li>
                </ol>
              </div>
            </footer>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
