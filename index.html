<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A two-player memory game." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Memory</title>
  </head>
  <body>
    <main class="app">
      <section class="home" aria-labelledby="home_title">
        <div class="home__content">
          <header class="home__headline">
            <p class="home__eyebrow">It’s play time.</p>
            <h1 class="home__title" id="home_title">Ready to play?</h1>
          </header>
        </div>

        <a class="play_button" href="./settings.html">
          <img class="play_button__icon" src="/assets/icons/controller_icon.svg" alt="" aria-hidden="true" />
          <span class="play_button__label">Play</span>
          <span class="play_button__arrow" aria-hidden="true">→</span>
        </a>

        <img class="home__controller" src="/assets/icons/controller_icon.svg" alt="" aria-hidden="true" />
      </section>
    </main>

    <script type="module" src="/src/home.ts"></script>
  </body>
</html>
