<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A two-player memory game." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Draw | Memory</title>
  </head>
  <body>
    <main class="app">
      <section
        class="game_result"
        id="tie_result_view"
        aria-labelledby="tie_result_title"
      >
        <h1 class="visually_hidden" id="tie_result_title" tabindex="-1">Game over: Draw</h1>
        <div class="game_result__content">
          <div class="game_result__summary">
            <div class="game_result__summary_top">
              <p class="game_result__eyebrow">It’s a</p>
            </div>
            <div class="game_result__draw_visual" aria-hidden="true">
              <img class="game_result__draw_image" src="./assets/images/draw_green.png" alt="" />
              <span class="game_result__draw_text">DRAW</span>
            </div>
          </div>
          <img
            class="game_result__scale_icon"
            id="tie_scale_icon"
            src="./assets/images/scale_icon.png"
            alt=""
            aria-hidden="true"
          />
          <div class="game_result__actions">
            <button class="game_result__back_button" id="back_to_start_button" type="button">
              <span class="game_result__back_label">Back to start</span>
            </button>
            <button class="game_result__new_game_button" id="new_game_button" type="button">
              <span class="game_result__back_label">Revanche</span>
            </button>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/pages/draw-page.ts"></script>
  </body>
</html>
